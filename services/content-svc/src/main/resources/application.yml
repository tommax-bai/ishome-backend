spring:
  application:
    name: ishome-content-svc
  datasource:
    # 待拍板②默认 Postgres；schema-per-service，禁止跨 schema 外键与 join（技术架构 §2.5）
    url: jdbc:postgresql://localhost:5432/ishome?currentSchema=svc_content
    username: ishome
    password: ishome
  flyway:
    schemas: svc_content
    default-schema: svc_content

server:
  port: 8080
