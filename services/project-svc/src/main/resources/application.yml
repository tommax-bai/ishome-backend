spring:
  application:
    name: ishome-project-svc
  datasource:
    # 已拍板②：Postgres；schema-per-service，禁止跨 schema 外键与 join（技术架构 §2.5）。
    # 默认值 = 本地开发 PG（docker compose 项目 ishome-dev，localhost:15432）；部署环境经 ISHOME_DB_* 环境变量覆盖。
    # stringtype=unspecified：MyBatis 以 String 参数写 jsonb 列（gen_params/lineage/directive 等）所需。
    url: jdbc:postgresql://${ISHOME_DB_HOST:localhost}:${ISHOME_DB_PORT:15432}/${ISHOME_DB_NAME:ishome}?currentSchema=svc_project&stringtype=unspecified
    username: ${ISHOME_DB_USER:ishome}
    password: ${ISHOME_DB_PASSWORD:ishome-local-dev}
  flyway:
    # svc_rulebook：知识资产库（规范 v2.2 规则 4.12，规则引擎模块持有，schema 独立可拆走）
    schemas: svc_project,svc_rulebook
    default-schema: svc_project
    enabled: true
    placeholders:
      # V2 的 rulebook schema 名：集成测试注入 svc_rulebook_it（clean 不触碰正式库）
      rulebook_schema: svc_rulebook

mybatis-plus:
  configuration-properties:
    # ReleaseMapper 的 ${rulebookSchema}：与 Flyway placeholder rulebook_schema 指同一 schema（IT 覆写为 _it 位）
    rulebookSchema: svc_rulebook

server:
  # 本地端口约定：channel 8102，project 8103，genpipe 入站面 8104
  port: 8103

ishome:
  project:
    genpipe:
      # 成文线派发入口（裁决④：走 HTTP，不用 Java Temporal SDK 直连）。
      # 默认值 = 本地开发的 genpipe-svc 入站面（uv run genpipe-http，端口 8104）；部署经环境变量覆盖。
      base-url: ${ISHOME_GENPIPE_BASE_URL:http://127.0.0.1:8104}
      # 下游只做"启动 workflow 即返回"，不等成文——超时按启动动作定，不按生成时长定。
      connect-timeout-ms: 2000
      read-timeout-ms: 10000
    # 本服务自己的对外地址：注入给编排侧当结果回调地址（编排侧不知道业务侧在哪）。
    # 本机默认回环；服务器上编排 worker 与本服务同机时同样可用，跨机经环境变量覆盖。
    self-base-url: ${ISHOME_PROJECT_SELF_BASE_URL:http://127.0.0.1:8103}
    # 会话侧 gRPC（产物呈现那一跳）：本机 chat-svc 默认 :9101，服务器 :19101 经环境变量覆盖。
    chat-target: ${ISHOME_CHAT_GRPC_TARGET:localhost:9101}
    outbox:
      # outbox 中继节拍：总线接入前由本服务定时把未投递事件送到会话侧
      relay-interval-ms: ${ISHOME_OUTBOX_RELAY_INTERVAL_MS:2000}
      relay-initial-delay-ms: 5000
    # 流程定义版本：建项时固化（D10）
    process-version: v1

  oss:
    # 私有产物存放（用户裁决 2026-08-30 晚）：报告册写在私有桶里，业主靠**签名链接**打开。
    # 桶级私有 + 链接自带有效期，本项目一个公网端口都不用开（同架构方案"图/视频走 CDN→OSS 直出不过网关"）。
    # 键由 report_id 确定性推得（contracts registries/object_keys.md），故不需要任何台账。
    # 凭证不入库：本机 ~/.ishome/oss-local.env，服务器 /opt/ishome/env/oss.env。
    # **默认全空**：没配时本服务照常起（里程碑与求值线不受影响），取册链接时响亮失败。
    endpoint: ${ISHOME_OSS_ENDPOINT:}
    bucket-private: ${ISHOME_OSS_BUCKET_PRIVATE:}
    access-key-id: ${ISHOME_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ISHOME_OSS_ACCESS_KEY_SECRET:}
    # 链接有效期：系统策略不是每人一议。七天＝业主在 IM 里收到链接、隔几天再点开是常事，
    # 而现在还没有"认人"（触发条件写死＝开始接外部真实用户时），没法在他点开那一刻现签一条新的。
    # **认人上线后改短、每次现签**——那时"只有他能打开"才真正成立。
    book-link-validity: ${ISHOME_OSS_BOOK_LINK_VALIDITY:P7D}
