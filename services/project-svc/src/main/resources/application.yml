spring:
  application:
    name: ishome-project-svc
  datasource:
    # 已拍板②：Postgres；schema-per-service，禁止跨 schema 外键与 join（技术架构 §2.5）。
    # 默认值 = 本地开发 PG（docker compose 项目 ishome-dev，localhost:15432）；部署环境经 ISHOME_DB_* 环境变量覆盖。
    # stringtype=unspecified：MyBatis 以 String 参数写 jsonb 列（gen_params/lineage/directive 等）所需。
    url: jdbc:postgresql://${ISHOME_DB_HOST:localhost}:${ISHOME_DB_PORT:15432}/${ISHOME_DB_NAME:ishome}?currentSchema=svc_project&stringtype=unspecified
    username: ${ISHOME_DB_USER:ishome}
    password: ${ISHOME_DB_PASSWORD:ishome-local-dev}
  flyway:
    # svc_rulebook：知识资产库（规范 v2.2 规则 4.12，规则引擎模块持有，schema 独立可拆走）
    schemas: svc_project,svc_rulebook
    default-schema: svc_project
    enabled: true
    placeholders:
      # V2 的 rulebook schema 名：集成测试注入 svc_rulebook_it（clean 不触碰正式库）
      rulebook_schema: svc_rulebook

mybatis-plus:
  configuration-properties:
    # ReleaseMapper 的 ${rulebookSchema}：与 Flyway placeholder rulebook_schema 指同一 schema（IT 覆写为 _it 位）
    rulebookSchema: svc_rulebook

server:
  # 本地端口约定：channel 8102，project 8103，genpipe 入站面 8104
  port: 8103

ishome:
  project:
    genpipe:
      # 成文线派发入口（裁决④：走 HTTP，不用 Java Temporal SDK 直连）。
      # 默认值 = 本地开发的 genpipe-svc 入站面（uv run genpipe-http，端口 8104）；部署经环境变量覆盖。
      base-url: ${ISHOME_GENPIPE_BASE_URL:http://127.0.0.1:8104}
      # 下游只做"启动 workflow 即返回"，不等成文——超时按启动动作定，不按生成时长定。
      connect-timeout-ms: 2000
      read-timeout-ms: 10000
