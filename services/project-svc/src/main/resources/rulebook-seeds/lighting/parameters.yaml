# parameter 形态 · 照明域
# 治理头：规则 4.10；可核性门：规则 4.10a（calibrated 只能由机检核验取得）
# 现状：全部 draft —— 数值来自行业通行做法与内部规范，尚未接外部标准原文（获取回路，规则 4.16）
domain: lighting
form: parameter
release: null            # 未发布；calibrated 条目齐备后方可 cut release

items:
  - id: lkp-accent-ratio
    name: 重点照明照度倍数
    number_class: analysis          # 数字三分法：分析数字（规则 2.3）
    value: {min: 3, max: 5, unit: "×环境照度"}
    formula: "重点照度 = 环境照度 × [3,5]"
    calibration: draft
    source: "GB 50034-2013 表5.2.1（住宅：起居室一般活动 100lx / 书写阅读 300lx，0.75m 水平面）——300/100=3× 即本倍数下界；上界 5× 为行业通行"
    source_pending: "GB 50034-2024（2024-08-01 实施）住宅表 —— 需核对新版数值是否变化"
    acquired: run-2026-08-27
    consumers: [art-lighting-chapter, art-purchase-checklist]

  - id: lkp-illuminance-living
    name: 起居室照度标准值
    number_class: analysis
    value: {general: 100, reading: 300, unit: lx, plane: "0.75m 水平面"}
    calibration: draft              # source 已可定位，待核验跑批后转 calibrated
    source: "GB 50034-2013 表5.2.1（jianbiaoku.com/webarbs/book/49/1044521）；GB 50034-2004 同值（cabr-th.com PDF）——两源一致"
    source_pending: "GB 50034-2024 新版核对"
    acquired: run-2026-08-27
    consumers: [art-lighting-chapter]

  - id: lkp-cct-living
    name: 起居与卧室色温
    number_class: selection         # 选型数字：可上清单，禁上 prec-schematic 图
    value: {v: 3000, unit: K}
    calibration: draft
    source: "行业通行；内部规范 §5.1"
    source_pending: "厂商公开参数交叉验证（≥2 源，规则 4.16）"
    consumers: [art-lighting-chapter, art-purchase-checklist]

  - id: lkp-cct-task
    name: 操作台与镜前色温
    number_class: selection
    value: {v: 4000, unit: K}
    calibration: draft
    source: "行业通行；内部规范 §5.1"
    source_pending: "厂商公开参数交叉验证"
    consumers: [art-lighting-chapter, art-purchase-checklist]

  - id: lkp-cct-night
    name: 夜灯动线色温
    number_class: selection
    value: {v: 2700, unit: K}
    calibration: draft
    source: "行业通行；内部规范 §5.1"
    source_pending: "厂商公开参数交叉验证"
    consumers: [art-lighting-chapter, art-purchase-checklist]

  - id: lkp-cct-variety-max
    name: 全屋色温种类上限
    number_class: analysis
    value: {max: 3, unit: "种"}
    calibration: draft
    source: "内部规范 §5.1（经验条目，无外部真源）"
    consumers: [art-lighting-chapter, cr-cct-variety]

  - id: lkp-cri-living
    name: 起居空间显色指数下限
    number_class: selection
    value: {min: 90, unit: Ra}
    calibration: draft
    source: "行业通行；内部规范 §5.1。注：GB 50034-2013 住宅底线为 Ra80，本值 90 是高于国标的品质档选择——属选型策略，须以厂商参数核实 Ra90 产品市场可得（run-2026-08-27 查明国标底线）"
    source_pending: "厂商公开参数交叉验证（Ra90 可得性）"
    consumers: [art-purchase-checklist]

  - id: lkp-beam-accent
    name: 重点照明光束角
    number_class: selection
    value: {min: 15, max: 24, unit: "°"}
    calibration: draft
    source: "行业通行；内部规范 §5.1"
    source_pending: "厂商公开参数交叉验证"
    consumers: [art-purchase-checklist]

  - id: lkp-pendant-drop-dining
    name: 餐桌吊灯下沿距桌面
    number_class: selection
    value: {min: 700, max: 800, unit: mm}
    calibration: draft
    source: "行业通行"
    source_pending: "人因工程数据源 —— 需定源"
    consumers: [art-purchase-checklist]
