# parameter 形态 · 人体工学域（本域参数密度最高：定制尺寸族 + 12 项通道校核）
# 值形态：规则 1.9（v2.8）两层模型——value_kind 声明落点由哪种项构成，value 只放值。
#       维度类项名走闭集 depth/width/height（自造缩写 min_d/min_w/d/h/w 一次性废除，规则 1.8 第三条）；
#       min/max 不是项而是项的值形态，故 {lkp-x.min} 语法上不存在。
domain: ergonomics
form: parameter
release: null
default_calibration: draft
default_source: "行业通行做法 + 内部规范 §5.2 转写"
default_source_pending: "人因工程数据源与住宅设计规范 —— 需定源并取原文（获取回路，规则 4.16）"

items:
  # —— 定制尺寸族（选型数字，给定制商的表达件）——
  # 公式落点的 value_kind 声明的是"代入匿名输入后求出什么形态"：其可执行形态在 RulebookEvaluator
  # 按 assetId 显式登记，形态与此处声明必须一致（不一致即契约 valueKind 与 value 对不上）。
  - {id: lkp-counter-height, name: 橱柜台面高, number_class: selection, value_kind: range, formula: "主厨身高/2 + [50,100]", unit: mm, consumers: [art-ergonomics-chapter, art-purchase-checklist]}
  - {id: lkp-wall-cabinet-bottom, name: 吊柜底沿距台面, number_class: selection, value_kind: range, value: {min: 600, max: 700}, unit: mm}
  - {id: lkp-sink-depth, name: 水槽深度, number_class: selection, value_kind: range, value: {min: 180, max: 220}, unit: mm}
  - {id: lkp-desk-height, name: 书桌高, number_class: selection, value_kind: single, value: 720, unit: mm, linked: lkp-chair-height,
     source: "run-2026-08-28-2 定源（**部分**）：GB/T 3326-2016《家具 桌、椅、凳类主要尺寸》（2016-12-13 发布 / 2017-07-01 实施，代替 GB/T 3326-1997；术语含'桌面高/座高/中间净空高'；antpedia.com/standard/8422498-1、yjser.com/a/jiancebiaozhun/3614）——标准号与量的定义已可定位，**数值表未取到**（在付费墙内）。旧版单源旁证：GB/T 3326-1997 桌面高 680~760mm（huida18.com/standard/12331、beitest.com/zixunxinxi/biaozhun/15281）——720 落在该带内，但单源不足以采",
     acquired: run-2026-08-28-2}
  - {id: lkp-chair-height, name: 座椅高, number_class: selection, value_kind: single, value: 450, unit: mm,
     source: "同 lkp-desk-height：GB/T 3326-2016 标准号已定位，数值表未取到。旧版单源旁证：GB/T 3326-1997 椅座面高上限 460mm、桌椅高差 250~320mm——450 与 720 的高差 270mm 落在该带内，但单源不足以采",
     acquired: run-2026-08-28-2}
  - {id: lkp-bed-height, name: 床面高, number_class: selection, value_kind: range, value: {min: 450, max: 500}, unit: mm}
  - {id: lkp-wardrobe-rod, name: 衣柜挂杆高, number_class: selection, value_kind: single, formula: "身高 × 1.2", unit: mm}
  - {id: lkp-switch-height, name: 开关高, number_class: selection, value_kind: single, value: 1300, unit: mm}
  - {id: lkp-socket-height-common, name: 常用插座高, number_class: selection, value_kind: single, value: 300, unit: mm}
  - {id: lkp-mirror-height, name: 镜面中心高, number_class: selection, value_kind: single, formula: "使用者眼高", unit: mm}

  # —— 通道与操作校核（分析数字，12 项）——
  - {id: lkp-passage-main, name: 主通道净宽, number_class: analysis, value_kind: range, value: {min: 900}, unit: mm}
  - {id: lkp-passage-secondary, name: 次通道净宽, number_class: analysis, value_kind: range, value: {min: 750}, unit: mm}
  - {id: lkp-sofa-table-gap, name: 沙发至茶几间距, number_class: analysis, value_kind: range, value: {min: 350, max: 450}, unit: mm}
  - {id: lkp-dining-pullback, name: 餐桌就座侧退让, number_class: analysis, value_kind: range, value: {min: 900}, unit: mm}
  - {id: lkp-bed-side, name: 床侧净距, number_class: analysis, value_kind: range, value: {min: 750}, unit: mm}
  - {id: lkp-wardrobe-front, name: 平开门衣柜前净距, number_class: analysis, value_kind: range, value: {min: 900}, unit: mm, variant: {移门: 600}}
  - {id: lkp-kitchen-u-gap, name: U型厨房两排间距, number_class: analysis, value_kind: range, value: {min: 900, max: 1200}, unit: mm}
  - {id: lkp-toilet-center-offset, name: 马桶中线距侧墙, number_class: analysis, value_kind: range, value: {min: 350}, unit: mm}
  - {id: lkp-shower-clear, name: 淋浴房内空, number_class: analysis, value_kind: dimension, value: {depth: {min: 800}, width: {min: 800}}, unit: mm}
  - {id: lkp-tv-distance, name: 电视观看距离, number_class: analysis, value_kind: range, formula: "屏高 × [3,4]", unit: mm}
  - {id: lkp-entry-cabinet-depth, name: 玄关柜深, number_class: analysis, value_kind: range, value: {min: 350}, unit: mm}
  - {id: lkp-fridge-vent, name: 冰箱散热净距, number_class: analysis, value_kind: range, value: {min: 50}, unit: mm}
  - {id: lkp-work-triangle, name: 厨房工作三角周长, number_class: analysis, value_kind: range, value: {min: 3.6, max: 6.6}, unit: m}
