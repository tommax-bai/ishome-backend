# parameter 形态 · 软装配色域
# 值形态：规则 1.9（v2.8）两层模型。60-30-10 三项是 component（主/辅/点缀是配色分项，
# 不是档位也不是场景），项名 main/secondary/accent 登记在 contracts registries/anchor_items。
domain: softdeco
form: parameter
release: null
default_calibration: draft
items:
  - {id: lkp-color-ratio, name: 主辅点缀配色比例, number_class: analysis, dimensionless: true, value_kind: component, value: {main: 0.6, secondary: 0.3, accent: 0.1},
     source: "行业通行（60-30-10）", source_pending: "无外部标准，属经验条目"}
  - {id: lkp-color-main-max, name: 全屋主色数量上限, number_class: analysis, value_kind: range, value: {max: 3}, unit: 种,
     source: "内部规范 §5.8（经验条目）"}
  - {id: lkp-blackout-rate, name: 卧室窗帘遮光率, number_class: selection, value_kind: range, value: {min: 0.9}, unit: 比率,
     trigger_note: "朝向触发：东向/南向主卧取上限", source_pending: "遮光率检测方法标准 + 厂商参数 ≥2 源"}
  # value_kind=range 声明的是公式求出的那个量：外扩量 [200,300]mm。"短边不小于沙发长度"是同一条
  # 规则里的另一句约束（一个不等式，不是一个可引用的项），公式可执行形态未登记前不产出落点。
  - {id: lkp-rug-size-rule, name: 地毯尺寸规则, number_class: selection, value_kind: range,
     formula: "沙发前沿外扩 [200,300]mm，短边不小于沙发长度", unit: mm, linked: [ergonomics/lkp-sofa-table-gap]}
