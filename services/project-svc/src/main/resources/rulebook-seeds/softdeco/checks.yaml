domain: softdeco
form: check
inherit: _common/checks.yaml
items:
  - {id: cr-softdeco-color-collect-visual, type: cross_field, scope: [需求采集],
     require: "色彩偏好必须经 H5 视觉网格采集，禁止文字问色彩（规则 5.14/6.4）", message: "文字问色彩"}
  - {id: cr-softdeco-render-color-match, type: cross_field, scope: [art-color-soft-chapter, art-space-render],
     require: "章内色彩方案与效果图取色一致", message: "色彩方案与效果图不一致"}
  - {id: cr-softdeco-main-color-count, type: count_max, scope: [art-color-soft-chapter], field: 主色数量, max_from: lkp-color-main-max,
     message: "全屋主色数量超上限"}
  - {id: cr-softdeco-mode-split, type: cross_field, scope: [art-color-soft-chapter],
     require: "情绪叙事=gen-generated，数据与清单=gen-evaluated/gen-assembled，组合矩阵不破（规则 2.5）", message: "生成方式越档"}
