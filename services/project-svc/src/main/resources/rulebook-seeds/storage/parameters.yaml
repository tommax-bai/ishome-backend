# parameter 形态 · 收纳域
# 值形态：规则 1.9（v2.8）两层模型——value_kind 声明落点由哪种项构成，value 只放值。
#       行李箱仓位的自造缩写 w/d/h 改为维度闭集 depth/width/height；挂/叠/抽三项是 component，
#       项名登记在 contracts registries/anchor_items（受控词表，核验按词表拒灌）。
domain: storage
form: parameter
release: null
default_calibration: draft
items:
  # 单位「延米」→「米」，题名同改（用户裁决 2026-08-30 晚，选乙案）。**数一个字没变**：
  # 一延米就是沿墙一米，换的是对业主的说法不是量。为什么非换不可：单位自本轮起由写手写进正文
  # （我们预制、它照抄），而「延米」正是本域禁词——同一个词既是计量单位又禁止对业主说，
  # 机器会一边要求它写、一边因为它写了而打回，这一章永远过不了检（gate-unit-collides-banned-term
  # 会在第一次跑时整包拦下）。禁词表不动：「延米」对业主仍然不说。
  # **后续路径写死**：清单页族落地时，采购/报价对照页按行业口径仍用「延米」——那两页是给工人
  # 与报价看的，与业主正文各用各的说法（同"表格里'旁边'指列头"那条的同一批处置）。
  - {id: lkp-storage-density-baseline, name: 收纳密度基准, number_class: analysis, value_kind: range, value: {min: 0.25, max: 0.35}, unit: "米/㎡",
     source: "内部规范 §5.7（基准值明确标注待校准）",
     source_pending: "★ 无外部真源。转正路径只能是埋点信号（用户实际反馈够不够）——规则 4.10a"}
  # value_kind 由 single 改 range（2026-08-31）：这一条现在**求得出来了**——求值线实现了
  # `套内面积 × 收纳密度基准`，而密度基准本身是区间（0.25–0.35 米/㎡），乘出来自然是区间。
  # 与原公式「Σ 各柜体投影沿墙长度」是**同一个概念的两条精度**不是两套名（规则 1.8 第四条）：
  # 现在这条按面积推算，来源＝经验默认值、区间宽；定稿平面接通后按柜体实算，区间收窄。
  # ★ 执行者提议，非用户裁决：用粗公式先出这个数、而不是继续记 gap-。
  - {id: lkp-storage-total-meters, name: 全屋收纳沿墙总长, number_class: analysis, value_kind: range, formula: "套内面积 × 收纳密度基准（粗算，来源=经验默认值）；定稿平面接通后改按 Σ 各柜体投影沿墙长度实算", unit: 米}
  # 原有 tolerance: 0.1 已删（用户裁决 2026-08-30，规则 4.10e）。查证：它自种子首版（b036bd4，
  # 系统批量编译那一轮）就在，而 source 只写"行业通行（二八原则）"——二八原则给的是 0.8、没给 ±0.1，
  # 同条自己还写着"无外部标准，属经验条目"。即**它是编译时自造的精度声明，没有源**。
  # 删的理由不是没用，是它在用一个编造的数字重复表达"这条不确定"——而不确定性本就由标注承担
  # （规则 4.10c：经验条目照发、随页挂标注、语域限建议口吻）。删后本条即标准单值，无第三种值形态。
  # 比率改百分数（用户裁决 2026-08-31，四域一批，判据见 softdeco/parameters.yaml 该批首条注释）：
  # 量没变，0.8 就是 80%；立案＝真跑成册逐字「我们建议封闭收纳占比就用 0.8」「悬挂 0.5、叠放 0.3、
  # 抽屉 0.2」。本条的 source「二八原则」自己给的就是 80，存成 0.8 是编译时折算过一次。
  # 「二八原则」仍是本域禁词，只是不说这四个字，不妨碍把 80% 印出来。
  - {id: lkp-storage-closed-ratio, name: 封闭收纳占比, number_class: analysis, value_kind: single, value: 80, unit: "%",
     source: "行业通行（二八原则）", source_pending: "无外部标准，属经验条目"}
  - {id: lkp-wardrobe-hang-fold-ratio, name: 衣柜挂/叠/抽比例, number_class: selection, value_kind: component, value: {hang: 50, fold: 30, drawer: 20}, unit: "%",
     source_pending: "随 Q-STORAGE 衣物量实测回流校准"}
  - {id: lkp-long-hang-height, name: 长衣区净高, number_class: selection, value_kind: range, value: {min: 1400}, unit: mm,
     linked: [ergonomics/lkp-wardrobe-rod]}
  - {id: lkp-luggage-bay, name: 行李箱仓位净尺寸, number_class: selection, value_kind: dimension, value: {depth: 350, height: 800, width: 500}, unit: mm,
     source_pending: "常见 24/28 寸箱体外廓 —— 取厂商公开尺寸交叉验证"}
