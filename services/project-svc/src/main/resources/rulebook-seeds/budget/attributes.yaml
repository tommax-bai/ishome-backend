# attribute 形态 · 工项单价库（时效资产，effective 必填 —— 规则 4.10）
# 数据源裁决（用户 2026-08-23）：公开数据起步，置信按 source 分级
# 2026-08-27 获取回路首跑（run-2026-08-27）：四项全部接上公开行情，置信 low → 区间放宽
# （lkp-budget-confidence-width: low=±50%）。仍为 draft——核验跑批未建，跑批后可转 calibrated。
domain: budget
form: attribute
entity_type: work_item
release: null
attribute_schema:
  unit: {type: string, desc: "㎡ / 延米 / 点位 / 项"}
  price_range: {type: array, desc: "[low, high]"}
  city_tier: {type: string, desc: 城市档}
  confidence: {type: string, enum: [high, medium, low], desc: "决定区间宽度，见 lkp-budget-confidence-width"}
  effective_from: {type: date, required: true}
  effective_to: {type: date, required: true}
items:
  - id: attr-price-demolition
    name: 墙体拆除
    calibration: draft
    props: {unit: ㎡, price_range: [20, 60], city_tier: 全国粗档, confidence: low,
            effective_from: 2026-08-27, effective_to: 2026-11-27,
            breakdown: {普通墙: [20, 30], 砖混墙: [30, 40], 混凝土墙: [40, 60]}}
    source: "装信通 zx123.cn/zxbk/2392615（2025 拆除报价明细）"
    source_2: "知乎 zhuanlan.zhihu.com/p/9402395749（2025 人工材料清单；含铲墙皮打包价 80 元/㎡，口径不同已拆分）"
    note: "两源口径有别（纯拆除 vs 打包），取纯拆除口径入区间"

  - id: attr-price-electrical-point
    name: 水电点位（开关/插座/水口各计一位）
    calibration: draft
    props: {unit: 点位, price_range: [150, 500], city_tier: 全国粗档, confidence: low,
            effective_from: 2026-08-27, effective_to: 2026-11-27}
    source: "m.sohu.com/a/1025834698_122469136 与 zx123.cn/2021/1220/2353557（每点位 150-300 元；100㎡ 约 50-70 位）"
    source_2: "m.shejiben.com/ask/wenda/143518 与 m.jia.com/wenda/a-476738（每位 200-500 元）"
    note: "两源重叠区 200-300；区间取并集、置信 low。另一计价口径：按面积 90-120 元/㎡ 全屋"

  - id: attr-price-custom-cabinet
    name: 定制柜（投影面积计价）
    calibration: draft
    props: {unit: 投影㎡, price_range: [800, 1800], city_tier: 全国粗档, confidence: low,
            effective_from: 2026-08-27, effective_to: 2026-11-27,
            breakdown: {经济: [800, 1000], 中端: [1000, 1300], 高端: [1300, 1800], 高定下限: 1800}}
    source: "知乎 zhuanlan.zhihu.com/p/2036013911363860056（2026 全屋定制盘点，投影面积四档）"
    source_2: "新浪财经 k.sina.cn/article_7857141524_1d452771401901o962（2025 定制成本；实例 30㎡ 柜体中档约 4.2 万 ≈ 1400 元/投影㎡，与档表自洽）"
    note: "单位从'延米'改为源生口径'投影㎡'——延米换算依赖柜高假设，不做推导（规则 4.16 可定位原则）；★ 总价主驱动项，第二优先补城市档"

  # quantity_basis（2026-08-31 新增，本域第一条）：**这条单价乘的是哪个量**。
  #
  # 立案：五条单价里三条的 unit 字面都是「㎡」，但它们要的是三个完全不同的量——拆除的㎡是被拆
  # 墙体面积、涂刷的㎡是墙面展开面积、这一条的㎡是**建筑面积**。计价单位回答"按什么收钱"，
  # 不回答"乘哪个数"。没有这个字段，求值线就只能靠资产名里那句中文猜，或者在代码里硬编一张
  # id→量 的表——前者不可靠，后者把数据搬进了逻辑（红线：配置只放数据，逻辑归服务）。
  #
  # 取值是**匿名画像里那个量的字段名**，现在闭集只有 building_area_sqm 一个：其余四条的量
  # （拆除面积/墙面展开/柜体投影/点位数）**一个都还不存在**，所以它们暂不带此字段，
  # 也就产不出金额——**拿不到就说没有，不许填猜的值**。量到位时各自补上。
  # cost_round_to（规则 4.10e 增补，用户裁决 2026-09-08）：派生金额 lkp-cost-* 的取整粒度，单位元。
  # 到百元：拍板原话"估算类金额到百元"——单价 confidence low、区间本就 ±50% 宽，2200–5984 里那个
  # 84 是假精度。只取整派生的金额，单价原值不动；没有 quantity_basis 的条目不产金额、也不声明。
  - id: attr-price-hydro-labor-sqm
    name: 水电改造人工费（按建筑面积计价口径）
    calibration: draft
    props: {unit: ㎡, quantity_basis: building_area_sqm, cost_round_to: 100, price_range: [25, 68], city_tier: 分档见 breakdown, confidence: low,
            effective_from: 2026-08-28, effective_to: 2026-11-28,
            breakdown: {一线: [60, 68], 二线: [35, 58], 三四线: [25, 50]}}
    source: "图纸之家 tuzhizhijia.com/fangchan/8468（2023 全国 43 份水电报价：上海 60/北京 68/深广 68/天津 58/长沙武汉 55/渝蓉 35/贵州 25-35/金华 50/杭州 40-50）"
    source_2: "尚美饰家 m.smsj.com/strategy/30877-23547（全国 37 地水电施工队价格）+ 搜狐 m.sohu.com/a/1025834698（2026 报价，墙面打孔另算约 50 元/个）"
    note: "★ 城市档首次取得（run-2026-08-28）——一线约为三四线 2-3 倍。与 attr-price-electrical-point 点位口径并存，禁跨口径换算；43 份样本跨 2023-2026，置信 low"

  # 全屋硬装行情单价（2026-09-08 新增，获取回路 run-2026-09-08）：业主最先问的是"110 ㎡ 大概要花多少钱"，
  # 造价章此前只有分项占比带和一笔水电人工费——按项精算要等平面图（布局求解零代码），行业本就有按建筑面积
  # 报的硬装行情，这条把它接进来，求值线现成的"单价 × 建筑面积"算出 lkp-cost-hardfit-total-sqm。
  # 口径（只记源生口径，禁跨口径换算，同 lkp-budget-share 的教训）：
  #   · 数是"硬装/全包"口径＝拆改+水电+泥木+油漆+主材，**不含软装家具家电**——源里"硬装报价"与"全包装修均价"
  #     两种写法给的是同一档数（一线 1000-3000 vs 1500-2500、二线两源同为 800-2000），按同口径并集入档；
  #   · 与 lkp-budget-tier-gap 引的"整装 简装 1000-1500/精装 2000-2500"是另一口径（含软装），不并；
  #   · 三档＝城市档（一线/二线/三四线），键面照 attr-price-hydro-labor-sqm 逐字命中；三四线只取到一源，
  #     以淮安（全包 850-1050）、惠州（中等全包 1100-1500）两个城市实例作旁证；
  #   · 低中高档只取到**全国粗档**（grade_breakdown，土巴兔 2025-09-29），城市档 × 档位的交叉表没有源，不推。
  #   · 按㎡报价的行业惯例分母是建筑面积，源未逐字声明——quantity_basis 记 building_area_sqm 是取惯例，写在这里。
  # cost_round_to 到百元照 2026-09-08 拍板"估算类金额到百元"；这条派生金额跨十万级（110 ㎡ 约 5.5-33 万），
  # 百元位已是假精度，到千元更合适——只在此建议，口径未改。
  - id: attr-price-hardfit-total-sqm
    name: 硬装全包行情单价（按建筑面积计价口径）
    calibration: draft
    props: {unit: ㎡, quantity_basis: building_area_sqm, cost_round_to: 100, price_range: [500, 3000], city_tier: 分档见 breakdown, confidence: low,
            effective_from: 2026-09-08, effective_to: 2026-12-08,
            breakdown: {一线: [1000, 3000], 二线: [800, 2000], 三四线: [500, 1500]},
            grade_breakdown: {基础: [800, 1200], 中档: [1200, 1800], 高端: [2000, 3000]}}
    source: "土巴兔装修大学 to8to.com/yezhu/z338598.html（2025-11-04，取数 2026-09-08）：「一线城市普通住宅硬装报价每平方米约1000-3000元，二线城市则在800-2000元区间波动」；同文转载于新浪 k.sina.com.cn/article_7857141524_1d452771401901wi28.html（2026-04-15）"
    source_2: "网易 c.m.163.com/news/a/KIK0HVJ60520LP4V.html（2026-01-06，取数 2026-09-08）：「一线城市全包装修均价1500-2500元/㎡，二三线800-2000元/㎡，三四线500-1500元/㎡」；同文「惠州中等装修全包1100-1500元/㎡」"
    source_3: "档位（全国粗档）土巴兔装修大学 to8to.com/yezhu/z329454.html（2025-09-29，取数 2026-09-08）：全包「基础装修 800-1200元/㎡ / 中档装修 1200-1800元/㎡ / 高端装修 2000-3000元/㎡及以上」"
    source_4: "城市实例旁证（取数 2026-09-08）：土巴兔 m.to8to.com/yezhu/z230196.html 一线分城「北京 1500-2500 / 上海 1800-2800 / 广深 1600-2600」；to8to.com/yezhu/z347884.html 西安（2025-12-03）全包「1100-1600」；新浪 k.sina.com.cn/article_7857141524_1d452771401901uod4.html 淮安（2026-04-09）全包「100㎡ 960 元/㎡、中端 1380 元/㎡」"
    note: "★ 全屋硬装口径首次取得（run-2026-09-08）。一线两源 1000-3000 / 1500-2500 取并集、置信 low；二线两源一致；三四线单源+两城旁证。高端档「3000 及以上」上限取 3000 记数。source 是行情文章不是报价单（每条带 URL + 原句 + 取数日）；种子记 draft，calibrated 只由 import_seeds 核验跑批按 4.10a 授予，与 attr-price-hydro-labor-sqm 同一条路"

