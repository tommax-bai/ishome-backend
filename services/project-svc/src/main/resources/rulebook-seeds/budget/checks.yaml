domain: budget
form: check
inherit: _common/checks.yaml
items:
  - {id: cr-price-commitment, type: regex_deny, scope: [art-budget-chapter],
     pattern: "总价|全包价|这个价能做|包工包料|约为\\s*\\d+\\s*万", message: "本章禁精确总价与成交承诺（规则 5.15）"}
  - {id: cr-budget-no-commerce, type: field_deny, scope: [art-budget-chapter],
     require: "本章不得出现任何商品挂载", message: "监督类产物植入商品（规则 9.2）"}
  - {id: cr-budget-stale-price, type: cross_field, scope: [art-budget-chapter],
     require: "任一消费的 attr-price-* 若 effective_to 越界，则本章降档为无金额形态", message: "使用过期单价出金额"}
  - {id: cr-budget-range-width, type: cross_field, scope: [art-budget-chapter],
     require: "区间宽度须与该条 confidence 匹配（lkp-budget-confidence-width）", message: "低置信数据给了窄区间"}
