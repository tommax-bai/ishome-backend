     source_pending: "★两处口径缺口：①GB/T 44309-2024 的**数值要求表**未取到（guifanku 预览止于 5.2 尺寸偏差，其余在登录墙；工标库/国家数字标准馆为付费）——现填值是**陶瓷板（GB/T 23266-2009）**口径底线，不是岩板口径，禁当岩板指标引用；②'哑光'是表面工艺，其光泽度/防滑/易清洁差异无标准值，需厂商检测报告 ≥2 源",
