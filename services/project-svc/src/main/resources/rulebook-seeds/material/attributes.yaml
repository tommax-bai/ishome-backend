     source_2: "标准识别与修订项交叉：CTI 华测 cti-cert.com/new/32052.html、山东省产品质量检验研究院 sdzjy.com.cn/index.php?c=article&id=1703（GB/T 3324-2024 解读）；文内自证——修订说明 g) 载明本次仅'更改了漆膜抗冲击性能要求（见表4 序号7）'，故序号 1-6、8、9 与 2017 版同值",
     source_pending: "★口径限制：以上是**国标合格底线**（对全体木家具的最低要求），不是白橡开放漆这一材质的实测属性值。材质级实测（开放漆木纹缝耐污、白橡本体硬度/耐划痕）仍需厂商公开检测报告 ≥2 源。另注 GB/T 3324-2024 §5.5.1 明示木蜡油/传统揩漆/传统烫蜡等特殊工艺不适用表4",
