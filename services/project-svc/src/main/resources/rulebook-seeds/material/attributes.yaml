# attribute 形态 · 材质属性卡
# 存储形态：attributes 表 entity_type + JSONB 属性包（规则 4.12），不按实体类建表
# ★ 这是图第 3 节点名的"材质属性表"
# run-2026-08-28-2：三条的**检测标准号**已定位（GB/T 3324-2024 表4/表5 原文直取、GB/T 44309-2024 岩板、
# GB/T 23266-2009 陶瓷板全文、GB/T 21196.2-2007 马丁代尔、GB/T 3920-2008 耐摩擦色牢度、QB/T 1952.1-2023 沙发）。
# ★ 但仍全部 draft：标准给的是**合格底线**，不是**材质属性值**——这两者是不同口径，见各条 source_pending。
domain: material
form: attribute
entity_type: material
release: null
attribute_schema:      # 该 entity_type 的属性 JSONSchema 草案（定稿后入 contracts）
  abrasion: {type: string, desc: 耐磨等级或转数, source_required: true}
  stain_resistance: {type: string, desc: 耐污}
  moisture: {type: string, desc: 防潮}
  care_cycle: {type: string, desc: 保养周期}
  eco_grade: {type: string, desc: 环保等级}
  aging_2y: {type: string, desc: "两年后的样子（★经验条目，恒 draft，只能降档呈现）"}
