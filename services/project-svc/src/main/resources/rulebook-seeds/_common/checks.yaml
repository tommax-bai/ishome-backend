# 跨域机检规则（编译期共用，灌库时物化进每个域的 release，保证 release 自包含）
# 依据：规范 §2.3 数字三分法 / §5.8-5.9 语言规范 / 规则 4.15 禁词表双消费
#
# 两类判据并存，靠 type + examples 区分执行层（图 v0.2 §3 判据下沉次序 schema > 规则 > prompt > 判官）：
#   规则层（reportgen gate）：带 pattern 的确定性机检，逐字比对，命中即拦；status 恒 active。
#   判官层（reportgen judge）：type=semantic_judge 且带 examples 的语义判据——规则层判不出
#     （"这句算不算编造事实"没有确定性判据，规则 4.10c 已写明机检不假实现），由判官按反例样例读；
#     status=observing 时只记录不拦截（规则 4.17 入册门禁第二道）。
scope: cross-domain
form: check

# ── 2026-09-09 批量退役：21 条 = 17 + 4（同日两次拍板，说明只写这一处，各域 checks.yaml 的
#    decided_by 指回这里）──
#
# 起因：《评审/检测规则清单-哪些真在跑-2026-09-09.md》二·D 清点出——报告线 31 条 cr- 判据里
# **21 条标着 active 却没有任何执行路径**：规则层只挑带 `pattern` 的（gate.py:991），判官层只挑带
# `examples` 的（judge.py:102-104），这 21 条两样都没有，永远轮不到执行。用户 review 后按承接程度
# 分三类：第一次拍板退掉第一、二类共 17 条，第三类 4 条"部分承接"当时留着未表态；**同日第二次拍板
# 把这 4 条也退掉**（见下面【第三类】），至此 21 条全部退役，这批纸上判据清零。
#
# 【第一类 · 14 条真空档】它管的事**今天没有任何别的东西在管**。
#   用户原话："报告册没人管的14条全部去掉。先不加这些限制了，我觉得没必要。后面的话我们看报告侧再再说。"
#   口径当场由用户收紧："不是明确不做了，是先把它去掉。然后呢，以后如果需要的时候我们再补，不需要
#   就不管它了"、"我们后续要看实际例子的情况，再来判断是不是需要这个意思。"
#   所以这批是**先去掉、保持开放**，不是"判定这条限制不需要"的终局裁决。要不要补回来的判据写死在
#   真跑样本上：真报告里出现了这类问题再议，没出现就不管——与《纪律·只收真跑样本》《纪律·阈值有
#   数据才定》同向（今天既没有样本也没有阈值，现在加限制就是凭空立规矩）。
#   **"没有替代品"这一句每条都要写明**：本批与下面第二类在数据里长得一模一样（都是 status: retired
#   的死行），日后翻到这批的人若默认"它们是被别处兜住了才退的"，就又造出一个"以为有门、其实没门"
#   ——那正是本次清点要消掉的那种错觉。退役后这件事就是没门，照实说。
#   本批 14 条落处：
#     _common/    cr-no-position-number-on-schematic
#     lighting/   cr-cct-variety · cr-lighting-no-number-on-plan · cr-lighting-scene-modes
#     material/   cr-material-variety · cr-material-spec-word
#     softdeco/   cr-softdeco-main-color-count · cr-softdeco-color-collect-visual · cr-softdeco-render-color-match
#     budget/     cr-budget-range-width · cr-budget-no-commerce
#     ergonomics/ cr-ergo-passage-pass · cr-ergo-size-table-expanded
#     storage/    cr-storage-verdict-first
#
# 【第二类 · 3 条完整承接】数据行是死的，但它管的事已由代码里另一个名字在管。退役理由是**同一件事
#   不两处声明**——留着早晚两边说的不一样（同 cr-bound-word-before-placeholder 那条的"两半分居必
#   改一处忘一处"）。承接者逐条写进各自 decided_by：
#     cr-assertion-backed   → gate-assertion-not-budgeted + gate-assertion-unbacked（gate.py:1094-1125）
#     cr-budget-stale-price → gate-provenance-annotation-missing（activities.py:432-445）
#     cr-budget-disclaimer  → gate-locked-text-missing（activities.py:415-427）
#
# 【第三类 · 4 条部分承接】**同日第二次拍板退役**（version 1 → 2）。
#   用户原话："我觉得这些东西等 case 出现的时候再说吧，不要去做过多假设了吧。"
#   问的就是这 4 条怎么办。执行者当时为它们各编了一个假想场景来说明"漏了会怎样"，**用户否掉的正是
#   这种做法**：拿想出来的例子推动决定，和拿想出来的样例填判官反例是同一个错（规范 v2.3 §12 明令
#   样例只收真跑样本）。所以这 4 条的去留判据同样写死在真跑样本上：**真报告里出现了这类问题再议，
#   没出现就不管**——《纪律·只收真跑样本》《纪律·阈值有数据才定》。
#   **这一类与上面两类都不一样，理由不许套用**：第一类是"没有任何替代品"，第二类是"已被完整承接"，
#   **这 4 条是各自只有一半有人管、另一半没人管**。退役后没人管的那一半就是真的没人管，照实说；
#   谁也不许翻到这批 retired 就当它被别处覆盖了。逐条的"哪一半有人管、哪一半没人管"写在各域
#   checks.yaml 该条的注释与 decided_by 里，四条摘要：
#     softdeco/   cr-softdeco-mode-split      有人管＝写手编数字（gate-digit-outside-ref，gate.py:1207-1215）
#                                             没人管＝该生成的被写成清单（组合矩阵越档本身）
#     material/   cr-material-aging-downgrade 有人管＝被写进断言预算 requires 时顺带拦
#                                             （gate-assertion-unbacked，gate.py:1189-1206）
#                                             没人管＝不声明 assertions 直接写成断言句
#     storage/    cr-storage-baseline-draft   同上（有人管/没人管的分界与 aging-downgrade 一致）
#     ergonomics/ cr-ergo-size-source         有人管＝种子核验时空 source 记一条**警告**
#                                             （verify_seeds.py:485 走 warns，脚本 sys.exit 只看 errors，
#                                             所以发版拦不住）；没人管＝成文线这一层没有对应检查
#
# 处置形态照既有三条 retired（cr-unit-translation / cr-bound-word-before-placeholder /
# cr-draft-not-in-paid）：**不删行、升 version、写 status: retired**，老版本行留档，回滚＝切回旧
# release_tag。这 21 条全部无 pattern 也无 examples，故没有"摘 pattern"这一步（规则层不看 status，
# 带 pattern 的 retired 行会继续拦——这批不存在这个问题；判官层 judge.py 认 status，这批也够不着）。
# ────────────────────────────────────────────────────────────────────────────────────

items:
  - id: cr-weak-word
    type: regex_deny
    scope: [正文, 结论句]
    pattern: "可能|建议考虑|也许|宜(?![居])|尽量|视情况"
    message: "分析级结论句禁弱词（规则 5.9）"
    decided_by: "规范规则 5.9"

  - id: cr-methodology-language
    type: regex_deny
    scope: [正文]
    pattern: "依据|推导|验收标准|本方案|经严谨|综合考量"
    message: "方法论元语言外泄（规则 4.15）"
    decided_by: "规范规则 4.15"

  # retired（用户裁决 2026-09-08，version 1 → 2）：**裁决未变，判据的载体换到渲染层**——"工程量纲要给
  # 业主翻译"仍然成立，执行它的判据从 release 数据挪进渲染层：术语解释放**本页页脚一排**（规则 2.6，
  # 与"本页依据"并列），解释文案是契约仓受控词表的一列（同 registries/anchor_items 的形态），渲染层按本页
  # 出现的词表内单位挑出来印，写手不写不管；判据改成确定性的——页内出现词表内单位而页脚无该词解释＝整册拒出。
  # 退役理由＝它**从未命中**：原 pattern（留档）
  #     \d+\s?(mm|lx|K|Ra|°|延米|㎡)
  # 跑在**记号替换前**的正文上，而那时正文里只有 {lkp-*} 占位符、没有数字，数字是渲染层替进去的——
  # 一个永远匹配不到的判据等于没有。**pattern 一并摘掉**：规则层 gate 按设计不看 status（规则 4.10d），
  # 留着 pattern 的 retired 行会继续拦截，等于没退役。旧 release 快照里它原样保留，回滚＝切回旧 release_tag。
  - id: cr-unit-translation
    type: regex_require_annotation
    scope: [正文]
    version: 2
    status: retired
    require: "本页出现词表内单位时页脚须有该词解释（渲染层执行，规则 2.6）；原口径「同句须有生活化括注」作废"
    message: "工程量纲未翻译（规则 2.3）"
    decided_by: "规范规则 2.3；用户裁决 2026-09-08 换载体退役（术语解释放本页页脚一排，规则 2.6；判据由渲染层按契约仓词表执行）"

  # retired（2026-08-30，version 1 → 2）：**裁决未变，判据的载体变了**——用户裁决"单边界措辞归
  # 渲染层"仍然有效，执行它的判据从 release 数据挪进代码（reportgen gate-bound-word-before-ref
  # 与同族的 gate-unit-after-ref），语义整条被承接，不留空档。
  # 换载体的理由是它在真跑里漏了自己那条纪律：原 pattern（留档）
  #     (不少于|不低于|不小于|不超过|不高于|不大于|至少|最少|最多)\s*[（(]?\{lkp-
  # 靠**固定词表 + 紧邻占位符**匹配，2026-08-30 灯光章成品逐字
  #     `全屋灯光颜色种类不能多于 不超过 3 种 种。`
  # 两处全漏：「不能多于」不在表里、「上限」根本不是它认的边界词，而**单位叠字**（「种」写了两遍）
  # 这一半 regex 根本够不着——要判它得逐字比对这条落点自己的 unit，那只有数据包知道。
  # 同一条纪律的两半分居 release 数据与代码两处，必然改一处忘一处（坑单第 10 条同型），故合并到
  # 判得着数据的那一侧。**pattern 一并摘掉**：规则层 gate 按设计不看 status（规则 4.10d，
  # 明文禁止"修"），留着 pattern 的 retired 行会继续拦截，等于没退役。旧 release 快照里它原样保留，
  # 回滚＝切回旧 release_tag。
  - id: cr-bound-word-before-placeholder
    type: regex_deny
    scope: [正文, 结论句]
    version: 2
    status: retired
    message: "占位符前禁边界词——单边界值的措辞（不低于/不超过）由渲染层按值形态出，文句再带一遍即叠字（真跑立案：「不少于不低于 750 mm」一册 7 处）"
    decided_by: "用户裁决 2026-08-29 晚（单边界措辞归渲染层：边界语义在值里，只说一次）；2026-08-30 换载体退役，语义由 reportgen gate-bound-word-before-ref / gate-unit-after-ref 承接"

  # retired（用户裁决 2026-09-09，version 1 → 2）：**第一类·真空档**——成文线看不见图纸，今天没有
  # 任何代码在判"标着示意的图纸上有没有定位数字"，**不是被别处承接了才退的**。先去掉、保持开放，
  # 要不要补看后续真报告跑出来的样本。全批口径见本文件顶部「2026-09-09 批量退役」。
  - id: cr-no-position-number-on-schematic
    type: field_deny
    scope: [prec-schematic]
    version: 2
    status: retired
    require: "prec-schematic 图纸内不得出现任何定位数字"
    message: "prec-schematic 禁定位数字（规则 2.2）"
    decided_by: "规范规则 2.2；用户裁决 2026-09-09 退役（第一类真空档：今天没有任何替代品在管，非别处承接；先去掉、要不要补看后续真跑样本。批次说明见本文件顶部，证据见《评审/检测规则清单-哪些真在跑-2026-09-09.md》二·D）"

  # version 1 → 2（裁决 2026-08-29）：require 补"且为 calibrated"。这半句原先住在
  # cr-draft-not-in-paid 里，那条随隐藏档作废后 retire，它**仍然有效的那一半语义**（未过可核性门的
  # 落点撑不起判断句背书，规则 5.8 未被 v2.4 推翻）由本条承接——纪律不能随着一条判据下线而消失。
  # 执行器早已是这个口径（reportgen gate 校验 requires 的 lkp- 存在且非降档），本次是数据追上执行。
  #
  # retired（用户裁决 2026-09-09，version 2 → 3）：**第二类·完整承接**——上一段那句"执行器早已是
  # 这个口径"就是它退役的理由：这条数据行本身没有执行路径（无 pattern、无 examples），它写的判据
  # 逐字由代码里的 gate-assertion-not-budgeted（谓词在不在本域断言预算内）+ gate-assertion-unbacked
  # （requires 的 lkp- 存不存在、降没降档）执行。同一件事两处声明，早晚两边说的不一样，故留代码那侧。
  # **cr-draft-not-in-paid 的退役注释里"语义由 cr-assertion-backed v2 承接"这句随之改指**：
  # 那份语义今天的执行者是 gate-assertion-*，不是这条数据行。
  - id: cr-assertion-backed
    type: cross_field
    scope: [正文]
    version: 3
    status: retired
    require: "判断句谓词须在该域 persona.assertion_budget 内，且其 requires 的 lkp-* 已求值、且为 calibrated（过可核性门——未过门的落点照常进正文，但撑不起判断句背书）"
    message: "无计算背书的判断句（规则 5.8）"
    decided_by: "规范规则 5.8 + 规则 4.10a；v2.4 裁决 2026-08-29（承接 cr-draft-not-in-paid 退役后仍有效的语义）；用户裁决 2026-09-09 退役（第二类完整承接：判据由 reportgen gate-assertion-not-budgeted + gate-assertion-unbacked 逐字执行，同一件事不两处声明。批次说明见本文件顶部，证据见《评审/检测规则清单-哪些真在跑-2026-09-09.md》二·D）"

  # retired（裁决 2026-08-29，version 1 → 2）：**判据的名字就是被推翻的那条口径**——v2.4 取消了
  # "draft 禁入 PAID"，未校准资产照常进产物、随标注呈现。处置选 retire 而不是改 message：
  # 改了 message 名字就在说假话（"not-in-paid"），而判据名与语义必须一致；retire 不删行，
  # release 可回滚（切回旧 release_tag），审计看得见它曾经存在过。
  # 剩余有效语义（未过门落点不得作判断句背书）已由 cr-assertion-backed v2 承接，不留空档。
  # **2026-09-09 改指**：cr-assertion-backed 本身随本次批量退役下线（它同样没有执行路径），
  # 这份语义今天的执行者是代码侧的 gate-assertion-not-budgeted + gate-assertion-unbacked。
  # 承接链没有断，断的只是中间那一跳的数据行——照实记，免得日后顺着旧指向找到一条死行。
  - id: cr-draft-not-in-paid
    type: cross_field
    scope: [PAID 产物]
    version: 2
    status: retired
    require: "calibration=draft 的条目不得作判断句背书，只能降档呈现"
    message: "未校准资产进入 PAID 判断句（规则 4.10/4.10a）"
    decided_by: "规范规则 4.10/4.10a；v2.4 裁决 2026-08-29 整条退役（隐藏档取消，语义由 cr-assertion-backed 承接）"

  # ── 判官层判据 ────────────────────────────────────────────────────────────────────────
  #
  # 【首批入册 2026-08-28，规则 4.17 门禁三"每轮入册上限"的首次执行口径】
  # 原料：`_iteration/run-2026-08-28-judge-samples.md`（15 次 compose 真跑 / 38 次真实 LLM 调用）。
  # 排序判据不是频次，是**能不能溜进 verdict=ok 成品**——机检拦得住的缺陷不需要判官。
  # 本轮上限自定为：**新建判官 cr- ≤ 3 条；每条判据每轮新增样例 ≤ 2 条**。三条实据：
  #   ① **真样本供给是硬约束**：采集报告八类缺陷里，`bad` 与 `fixed` 同时逐字有据的只有四类，
  #      而这四类恰好就是四个"溜进成品"类（④参考口吻写成断言 / ③断言射程外推 / ①编造家庭事实 /
  #      ②自证式依据）。缺 `fixed` 的四类这轮补不了——补就是想象填充（§12 禁止项 + 规则 4.18
  #      宁薄勿撑）。上限不是拍的，是样本供给给死的：四类里 ① 已有判据，故新建恰好 3 条。
  #   ② **观察期供养能力**（门禁二）：每条新判据要跑 N 份看触发率才谈得上转正。本轮真跑 15 跑 /
  #      12 跑有产出。判官判据 1 → 4 条，每条约摊到 3 份有产出观察，是能分辨"触发率为零"与
  #      "本轮恰好没犯"的下限；再加就是判据多于样本，观察态数据读不出东西。
  #   ③ **判官 prompt 的判据面宽度**：judge.py 把本域全部带样例判据一次性下发，判据越多误报越多，
  #      而误报会污染门禁二的触发率统计（让不该转正的判据看起来在工作）。判据面本身要受控。
  #
  # 【为什么新建而不是挂到既有判据下——结构约束，不是偷懒】
  # 既有 27 条 cr- 里，除 cr-fabricated-fact 外全部是**规则层**判据（status=active）。核验跑批
  # 写死"带 examples 者必须 status=observing"（verify_seeds，门禁二），而 reportgen gate 执行
  # pattern 时**不看 status**。于是：
  #   - 给 `cr-weak-word` / `cr-methodology-language` 挂样例 → 种子里被迫写 observing，但 gate
  #     仍在逐字拦截 → **表说假话**（"状态真相在表"，import_seeds 原话"表要照实说"）。禁止。
  #   - 给 `cr-assertion-backed` / `cr-draft-not-in-paid` 挂样例 → 它们无 pattern、gate 不执行，
  #     表面可行；但同一条 id 上会同时出现规则层命中与判官观察，**门禁二的触发率统计从此不可分辨**，
  #     而"跨报告失败聚类"正是规则 4.17 判断"判据切分对不对"的信号源。合并即污染信号。
  # 结论：**一条 cr- 只能属一层**（规则层恒 active / 判官层 semantic_judge+observing），二者由
  # verify_seeds 的 status 约束在结构上互斥。故规则层判不出的三种语义缺陷各建一条判官判据。
  #
  # 落 _common/ 而非某个域：缺陷与领域无关。成文线可知的家庭事实全集 = 报告数据包里的匿名画像
  # （身高族 + 户型特征），十二个单元共用同一个输入面（图 v0.2 §0/§2），所以任何域都能犯、
  # 也都该被同一条判据管；物化进每个域的 release 后判官在每个单元都拿得到它。
  #
  # decided_by 两个锚，各管一半（选择理由）：
  #   规范规则 4.3 —— **正当性**。4.3 立的是溯源纪律："因为你提到平时在家办公"这类关于这家人的
  #     陈述必须回得到他说过的话（triggered_by → slots.source_event_id），并明写这是 stage-project
  #     的核心信任机制。编造家庭成员是该机制反向运行：系统说出这家人没说过的自己，业主读到的是
  #     "系统知道我家有谁"，而这件事系统并不知道。信任机制被反用，比措辞错误重。
  #   图 v0.2 §0 —— **可判定性**。"生成侧不知用户是谁，单元输入是 slots 派生的匿名结构"给出了
  #     判定所需的封闭前提：匿名画像即本线可知家庭事实的全集，画像外的家庭事实必然无源。
  #     没有这一条，"编造"无从判起（模型可辩称是常识）；有了它，判据是封闭的。
  # 只锚 4.3 会缺可判定性，只锚图 §0 会缺"为什么这是错的"，两条都要。
  #
  # 样例来源（规则 4.17：种子集初版来自冷启动期问题样本；规范 v2.3 §12：禁以想象填充）：
  #   前两条：2026-08-28 三域 PAID 端到端真跑，见《交接文档-2026-08-27晚》追记三"已知质量缺陷①"，
  #     是同一个真样本的两种 surface 形态（直陈 / 假设句）。
  #   第三条（2026-08-28 首批入册补入）：自迭代回路首采 §二-①，lighting r13 的 **verdict=ok 成品**
  #     原句。补它的理由是前两条缺的那一件——前两条都是"机检没管到的措辞"，这条是**全部机检开绿灯、
  #     已经可以发出去的成品里带着的编造**，是判官层存在理由的直接证物。
  #   本类命中密度是八类之首（有产出的 12 跑中命中 10 跑），但仍只补一条：报告里另有三个变体
  #     （"你平时可能一边在沙发上看书…" / "尤其家里有老人或小孩时…" / "孩子在地毯上玩积木"，末者
  #     **在全空画像下仍捏造**，证据价值最高）——它们只有 `bad` 没有 `fixed`，逐字补不全，
  #     这轮一律不收。判官库宁薄勿撑（规则 4.18）：宁可等下一轮采集把 `fixed` 采出来，不许现编。
  #   根因已按规则 4.19 改源处置（persona 自己在教模型编造家庭成员），改源不进判官库；
  #     lighting persona 无诱导句而"孩子"仍在 10 跑中出现，说明另有自发捏造，故判据仍需存在。
  - id: cr-fabricated-fact
    type: semantic_judge
    status: observing
    scope: [正文, 结论句]
    require: "关于这家人的事实（家庭构成、成员关系、职业、作息、既有物品）只能来自匿名画像与落点对象；画像里没有的一律不许写，假设句式也不行"
    message: "编造输入之外的家庭事实（规则 4.3 溯源纪律；图 v0.2 §0 匿名画像即输入全集）"
    decided_by: "规范规则 4.3 + 图 v0.2 §0；用户裁决 2026-08-28（判官反例库改由冷启动真跑样本自建）"
    examples:
      - bad: "你和你太太"
        why: "匿名画像里只有身高族与户型特征，没有任何家庭构成信息——「太太」是模型自己添的一个人。业主读到的是「系统知道我家有谁」，而系统并不知道；这正是规则 4.3 信任机制的反向运行。"
        fixed: "两个人同时用的时候"
      - bad: "家里有老人或小孩"
        why: "同一种编造换成假设句：画像没给家庭成员构成，「有老人或小孩」把没有的输入当成有。加不加「如果」不改变它凭空引入了一条这家人的事实。"
        fixed: "如果还有别的常用者，这个尺寸要另算"
      - bad: "比如沙发面料的纹理、孩子的画作、食物的颜色，都会更准确。"
        why: "匿名画像字段全集只有身高族 + layoutFeatures，无家庭构成，「孩子」是无中生有。违规则 4.3（个性化必须锚 triggered_by，「你说过的话变成了图上的东西」是 stage-project 核心信任机制，凭空捏造是它的反面）与图 v0.2 §0（生成侧不知用户是谁）。本句出自真跑 r13 的 verdict=ok 成品——机检全绿仍带此缺陷，机检全绿≠内容可发在真实链路上一次都没有成立过。"
        fixed: "比如沙发面料的纹理、衣服的颜色、饭菜的成色，在这种光下都更接近本来的样子。"

  # decided_by 两个锚，各管一半：
  #   规范规则 4.10c —— **正当性 + 归层**，一条给全。它写死"未过可核性门的落点只能以参考口吻进
  #     正文，撑不起判断句"，同条又明写"'这句话算不算判断句'没有确定性判据，**机检不假实现**——
  #     语义识别归判官层"。全规范里同时给出"这是错的"与"该谁判"的只有这一条，故为主锚。
  #   规范规则 5.8 —— **射程**。断言预算只花在有计算背书处；参考级语域"只出区间"。它划出违规的
  #     边界形态：把区间自行收窄成点值、以"构成主力/占去近半"式措辞下结论，都已经越出参考口吻。
  # 可判定性来自落点档位随包下发（anchors[].presentation，规则 4.10c 消费侧强制）：判官手上有
  # "这条落点是不是可作支点档"，才判得了"这句有没有把参考级写成结论"。没有档位就只剩文风之争。
  #
  # 为什么机检接不住（本条存在的全部理由，gate.py 文档已自陈）：规则层"只保证'声明了就必须有
  # 背书'，不保证'没声明就不是断言'"。真跑证据：r12 那一稿 assertions=[]、主旨句不含 {lkp-*}
  # 占位，于是 gate-assertion-unbacked 与 gate-thesis-degraded-anchor 双双不触发，**一稿即过**，
  # 直接成为三份 verdict=ok 成品之一。零背书且有产出的跑 2/2 命中——不是偶发。
  #
  # 样例来源：自迭代回路首采 §二-④，budget r12 的 verdict=ok 成品原句，`bad`/`fixed` 逐字取自
  # 采集报告。同族另有 lighting r07「厨房操作台需要比一般活动区域更亮的灯光。」——只有 `bad`
  # 没有 `fixed`，这轮不收（规则 4.18 宁薄勿撑）。
  # 造价域另叠加规则 5.15（全章参考级、只出区间），但缺陷形态与域无关（同族出在 lighting），
  # 故落 _common 而非 budget/。按规则 4.10b，本条不携带任何内容数值——采集报告里的占比区间
  # 一律不抄进 require/message，判官要的是形态不是阈值。
  - id: cr-undeclared-assertion
    type: semantic_judge
    status: observing
    scope: [正文, 结论句]
    require: "参考级落点（未过可核性门、随包下发为降档档位的）只能以参考口吻出现：给区间、给'这取决于什么'、给'还算不出来'。不得写成结论，不得把区间自行收窄成点值。是不是断言看句子怎么说，不看卡片有没有声明 assertions——没声明不等于不是断言"
    message: "参考口吻被写成断言（规则 4.10c：未过门落点撑不起判断句；机检只保证'声明了就必须有背书'）"
    decided_by: "规范规则 4.10c + 规则 5.8；用户裁决 2026-08-28（判官反例库改由冷启动真跑样本自建）"
    examples:
      - bad: "拆改、水电、泥木这三项通常构成前期硬装主力，而主材与定制往往占去近半支出。"
        why: "本轮 backed_predicates=[]，prompt 已逐字告知「各分项占比」这轮不许下结论；唯一支点 lkp-budget-share 是 REFERENCE_ONLY（draft），按规则 4.10c 只能参考口吻、不得作判断支点。此句以「构成主力」「占去近半」下了占比结论，且把两条区间自行收窄成点值「近半」——规则 4.10c 禁止的「引擎自己编数字」的对称形态。因为 assertions=[]，机检全线放过，一稿即过成为 verdict=ok 成品。"
        fixed: "每一项占多少，目前只能给参考区间，区间在表里逐项列。哪一项最后吃掉最多，取决于定制的延米数——这个数还没算出来。"

  # decided_by 两个锚，各管一半：
  #   规范规则 5.8 —— **正当性**。断言预算只花在"有规则计算背书处"；一个落点只背书得起它自己
  #     算的那件事，句子把它铺到别的对象上，那部分断言就是没有背书的断言。
  #   规范规则 4.10a —— **射程的来源**。可核性是逐条目的：条目的 source 覆盖到哪，它的背书力就
  #     到哪。落点名称即射程声明（"起居空间显色指数下限"只说起居空间），越名称即越 source。
  # 可判定性：落点对象随包下发带 name，判官拿名称与句子点名的对象一比即可判，是封闭前提；
  # 没有落点名这条判据无从判起（模型可辩称"都是室内空间"）。
  #
  # 为什么机检接不住：gate-assertion-unbacked 只校验 requires 的 lkp- **存不存在、降没降档**，
  # 不校验它背书的对象对不对。射程是名称语义，结构上判不了——判官层专属。
  # 真跑证据：4/15 跑命中，**三份 verdict=ok 成品里中了 2 份**（进成品率八类之首）。
  # 与 cr-assertion-backed 的边界：那条管"声明的谓词有没有背书"（规则层，恒 active，由
  # gate-assertion-unbacked 硬实现），本条管"背书够不够得着"。两件事，不合并——合并后门禁二
  # 的触发率读不出是哪一种失败（规则 4.17"同类失败反复归入其他说明判据切分不对"的反面操作）。
  #
  # 样例来源：自迭代回路首采 §二-③，lighting r13 的 verdict=ok 成品原句，`bad`/`fixed` 逐字。
  # 样例带 lighting 的落点名，但缺陷形态与域无关（任何域的落点都有名义射程），故落 _common。
  # version 1 → 2（用户裁决 2026-08-29 晚，规范 v2.5 §14.10）：requirement 收窄回立案形态。
  # v1 的措辞（"句子点了几个对象不改变落点管几个对象"）在叙事推导落地后把**合法归组**也拦了——
  # 新形态一张卡多条落点同讲一件事，判官 5/5 全拦，理由是"两条落点无交互参数"。用户裁定分界：
  #   合法：多落点**同主题**并列，各自背书各自对象（"床太高费力、床边太窄碰腿"——各说各的理由）；
  #   违规（本判据管）：把某落点的数/结论**按到它对象之外的空间/人群/场景头上**（立案样本：
  #     用起居显指背书走廊——业主会拿错的数去要求施工方）；
  #   违规（不归本判据）：落点间**编造耦合**（"得一起定/互相让/配着调"在独立参数间造不存在的约束）
  #     ——那是伪因果族（挂账⑧），与造价"拆除量挤压投影面积"同病。一条判据管一件事。
  # 立案样本原样保留作回归锚：收窄后"走廊也按起居标准"那句必须仍命中。
  - id: cr-anchor-out-of-scope
    type: semantic_judge
    status: observing
    version: 2
    scope: [正文, 结论句]
    require: "判断句的支点只在该落点自身名称与定义覆盖的对象上成立。违规＝把某个落点的数或结论按到它对象之外的空间、人群或场景头上（如用起居空间的显色指数背书走廊、餐厅、厨房）。**多个落点同属一个主题、各自背书各自对象、并列出现在同一句或同一张卡，不是外推，不报**；落点之间被写成'必须一起定/互相制约'式耦合关系的，属伪因果，不归本判据，也不在此报"
    message: "断言射程外推：把一个落点的数或结论按到它对象之外的空间/人群/场景头上（规则 5.8/4.10a）"
    decided_by: "规范规则 5.8 + 规则 4.10a；用户裁决 2026-08-28（真跑样本自建）+ 2026-08-29 晚收窄（规范 v2.5 §14.10：同主题并列不算外推）"
    examples:
      - bad: "你家起居室、卧室、走廊、餐厅、厨房一般活动区、卫生间的日常活动区域，灯光显色指数不能低于 {lkp-cri-living}。"
        why: "该卡 assertions 声明了「显色指数下限」，其唯一支点 lkp-cri-living 名称即「起居空间显色指数下限」，只背书起居/卧室。把它作为走廊/餐厅/厨房/卫生间的判断句支点＝用一个落点背书它射程之外的断言，违规则 5.8 与 4.10a。机检 gate-assertion-unbacked 只校验 requires 的 lkp- 是否存在且非降档，不校验射程——结构上判不了，判官层专属。"
        fixed: "你家起居室和卧室的灯光，显色指数不能低于 {lkp-cri-living}。走廊、餐厅、厨房、卫生间另有各自的要求，在选型表里分开列。"

  # decided_by 两个锚，各管一半：
  #   规范规则 1.6 —— **正当性**。明文禁止"空泛概念叙事、无计算依据的专业术语堆砌"。自证式依据
  #     宣称正是这条的纯形态：句子不增加任何可带走的内容，只增加一层"我是可信的"的自我宣告。
  #   规范规则 4.18 —— **可判定性，也是本条最重的那一半**。冷启动期首份报告发出前系统内零行为
  #     信号，所以"根据大量家庭使用反馈定下的"所指的事实**不存在**。这不是措辞问题，是模型
  #     **伪造了系统能力**——把规则 4.17"品味验证只能是转化与行为信号"反过来用，凭空宣称已有信号。
  # 判官手上的封闭前提：正文可用的依据面 = 落点对象自带的 source 与 name。正文自述的来源不在
  # 这个面里，即为自造。
  #
  # 与 cr-methodology-language 的边界（必须分立）：那条是 regex_deny 字面词表（依据|推导|验收
  # 标准|本方案|经严谨|综合考量），恒 active、在 gate 里逐字拦；真跑显示**模型已演化出整套绕开
  # 词表的同义变体**（8/12 跑命中，2 次进成品）。本条管的正是词表拦不住的那一层。挂同一条 id
  # 会让门禁二的触发率分不清是正则命中还是判官观察——两层各记各的，才读得出词表该不该补。
  #
  # 样例来源：自迭代回路首采 §二-②，lighting r08 的 verdict=ok 成品原句，`bad`/`fixed` 逐字取自
  # 采集报告（`fixed` 在报告里就是一句修法说明，不是改写句，原样保留——判官 prompt 本就不读
  # `fixed`，它只进审计记录）。报告同族另有四句真句与"最恶劣变体"（r05 伪造使用反馈来源），
  # 只有 `bad` 没有 `fixed`，这轮一律不收；下一轮采集补齐 `fixed` 后优先收 r05 那条。
  - id: cr-self-endorsement
    type: semantic_judge
    status: observing
    scope: [正文, 结论句]
    require: "结论的来源与可靠性不由正文自述。落点的依据在落点对象里，正文只给结论与它的生活后果。任何'这个数不是凭感觉/不是随便定的''是根据……确定的''是经过验证的'式自我背书都算违规，换个词面不改变性质；尤其禁止宣称结论来自使用反馈、实际验证或大量案例——冷启动期系统内没有这种信号，宣称它存在即虚构系统能力"
    message: "自证式依据宣称（规则 1.6 无计算依据的术语堆砌；规则 4.18 冷启动期零行为信号，'使用反馈'类来源不存在）"
    decided_by: "规范规则 1.6 + 规则 4.18；用户裁决 2026-08-28（判官反例库改由冷启动真跑样本自建）"
    examples:
      - bad: "这个倍数不是凭感觉定的，是根据人眼对明暗对比的实际响应确定的。"
        why: "lkp-accent-ratio 的背书是过了可核性门的国标条文，不是「人眼对明暗对比的实际响应」这一自造机理。属规则 1.6 明文禁止的伪专业形态（空泛概念叙事＋无计算依据的术语堆砌）。机检 cr-methodology-language 收的是字面词表，模型已演化出整套绕开词表的同义变体，本句一个禁词都没踩，进了 verdict=ok 成品。"
        fixed: "删掉自我背书，只留结论与生活后果。"
