# 版本唯一真源。Spring 生态版本由 Spring Boot BOM 管理（flyway/postgresql/testcontainers 等不在此重复钉版本）
[versions]
springBoot = "3.5.16"
mybatisPlus = "3.5.17"
# contracts 生成代码的运行时（与 ishome-contracts gen/java 包装声明一致，升级需两处同步；
# protobuf 最低版由 buf 远程插件的 gencode 决定——生成文件里 validateProtobufGencodeVersion 有写）
protobuf = "4.36.0"
grpc = "1.83.1"
archunit = "1.5.0"
ulid = "5.2.4"
# 飞书开放平台 SDK（渠道方言，只许 channel-svc 的 feishu adapter 包使用）
oapiSdk = "2.8.5"
junit = "5.12.2"
googleJavaFormat = "1.36.1"
checkstyle = "10.20.0"
pmd = "7.8.0"

[libraries]
mybatis-plus-starter = { module = "com.baomidou:mybatis-plus-spring-boot3-starter", version.ref = "mybatisPlus" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
oapi-sdk = { module = "com.larksuite.oapi:oapi-sdk", version.ref = "oapiSdk" }
annotations-api = { module = "org.apache.tomcat:annotations-api", version = "6.0.53" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
ulid-creator = { module = "com.github.f4b6a3:ulid-creator", version.ref = "ulid" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
# 以下由 Spring Boot BOM 定版
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
